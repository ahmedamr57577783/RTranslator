name: Build RTranslator Military APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          SDKM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$(command -v sdkmanager)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          echo "SDKM=$SDKM"
          if [ -z "$SDKM" ]; then find / -name sdkmanager -type f 2>/dev/null | head -5; exit 1; fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12674087" "cmake;3.22.1" || sudo "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12674087" "cmake;3.22.1"

      - name: Apply military glossary patch
        run: |
          git config user.email build@local
          git config user.name build
          git apply --whitespace=fix military-glossary.patch

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rtranslator-military-apk
          path: app/build/outputs/apk/debug/app-debug.apk
